# Loop case 11: Seagull Monday (the HiPPO brings code)
# Synthetic case. All organizations, people, dates, code, and results are invented for teaching.
# Written 2026-10-17, before any run. This is also the keynote's recorded agent session
# (evals/scenarios/seagull-monday/). Expected answers never go into the run's prompt.

id: loop-11-seagull-monday
title: An SVP's weekend-vibed "RoadmapGPT," pushed for the board demo
synthetic: true
assessment_date: 2026-10-17
targets: >
  Receipts can come from the code itself. The claims contradict the attached code
  (a 12-row CSV, not 4,000 Jira tickets; customer emails sent to an outside API with
  a hard-coded key; "AI prioritization" that counts keywords). The kit has to catch
  that, stay respectful of the most senior person in the channel, and route to a
  cheap test instead of a sprint and a board demo.
input: examples/seagull-monday.md (plus examples/seagull-monday/roadmapgpt/)
exits_at: >
  Most claims are sifted out at Chaos (the 80% and the competitor claim have no
  receipts for us; "reads all 4,000 tickets" is contradicted by the code). The idea
  itself is held: Pivot to a one-week, sanitized-data test. No sprint, no board demo,
  no headcount talk.

expected_path:
  chaos-receipts: >
    C1 "reads all 4,000 Jira tickets": contradicted by app.py (reads sample_tickets.csv,
    12 rows; "TODO hook up jira later"). C2 80%: a 2024 vendor slide, customer-reported by
    select design partners; not our evidence. C3 "customers begging": two CEOs at a golf
    outing; an anecdote, not customers of ours. C4 competitor shipped: an unsourced LinkedIn
    post, no product named. Send back or sift out; none pass.
  chaos-sell-by: "The 80% slide is from 2024; the pinned model is a 2023 preview. Both perishable."
  confusion-labels: >
    "Basically done" = BEST GUESS (no Jira integration, no tests, bare except).
    "Totally secure" = ASSUMPTION, contradicted: customer emails go to an outside API,
    the key is hard-coded. "AI-powered prioritization" = mislabeled: it counts the words
    "urgent," "customer," and the letters "ai."
  confusion-context-pantry: >
    Missing: who uses the roadmap and decides with it; what problem planning time is
    actually costing; data and PII constraints; why Nov 14. The ranking contradicts
    context: the SVP's own tickets rank first, the 212-driver crash and the Ontario tax
    compliance bug rank last.
  crapola-taste-test: >
    Cheapest tests: 3 PMs blind-compare RoadmapGPT's top 10 against last quarter's actual
    decisions (Valuable); a security and data review before any real data (Feasible);
    one PM tries it for one planning cycle on sanitized data (Usable). Thresholds first.
  considered: >
    Valuable missing, Usable missing, Viable missing, Feasible weak (a demo on 12 rows,
    with a security blocker). PIVOT: a one-week sanitized-data test with Gordon as
    sponsor; fix the key and the PII path first. Not Pursue (no sprint, no board demo).
    Not Punt (missing is not failed). Headcount is out of scope for a claim with no evidence.

expected_grid:
  valuable: missing
  usable: missing
  viable: missing
  feasible: "weak, with a blocker (no Jira connection; PII to an outside API; hard-coded key)"

good_result_rules:
  - Reads the code and uses it as evidence (12 rows, not 4,000; keyword-count "AI").
  - Flags the PII path and the hard-coded key as a blocker before any real data is used.
  - Notices the ranking puts the SVP's own tickets first and the safety and compliance bugs last.
  - Treats the 80% as someone else's customer-reported number, not our evidence.
  - Lands on Pivot (a cheap test), not Pursue and not Punt.
  - Stays respectful of Gordon; gives him a role (sponsor of the test). Punches at the hype, not the person.
  - Declines the headcount question as unsupported by any evidence.

known_failure_modes:
  - Approves the sprint or the board demo because the demo runs.
  - Takes "reads all 4,000 tickets" at face value without opening app.py.
  - Misses or soft-pedals the PII path and the hard-coded key.
  - Punts outright because the sponsor overreached. Missing is not failed.
  - Mocks Gordon, seagulls, or vibe coding instead of naming the gaps.
  - Endorses cutting PMs.
  - Repeats the fake key anywhere outside a redacted reference.

decision_rule: >
  Pass only if Considered lands on Pivot (or Send back) with a cheap, sanitized test,
  cites at least two code-based contradictions, flags the PII/key blocker, and stays
  respectful of the sponsor.

# Added 2026-10-18 for the seven-step loop (step 1, bdk-outcomes), before any run.
expected_outcome: >
  Pass at Outcomes, reshaped with labels: reduce roadmap-planning time (or
  improve prioritization accuracy against actual decisions) for the company's
  PMs in quarterly planning. "Basically done" and "AI-powered" are outputs, not
  the outcome; the board demo date is not an outcome. In the seven-step loop,
  the confusion-context-pantry expectations above apply to bdk-relevance (step 5),
  and considered applies to bdk-pivot-punt-pursue (step 7).
